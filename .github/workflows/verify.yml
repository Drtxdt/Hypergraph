name: Verify theme
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  TZ: UTC
jobs:
  public-verification:
    strategy:
      matrix:
        run: [primary, independent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
        env:
          HG_BROWSER: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-verification-${{ matrix.run }}
          path: .local/verification
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
      - run: npm ci
      - run: node tools/verify-timezones.mjs
      - run: npm run verify:compat
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.node }}
          path: .local/compat-v2/report.json
