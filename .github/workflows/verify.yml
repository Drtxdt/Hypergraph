name: Verify theme
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  TZ: UTC
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run verify:fast
  public-verification:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [functional, performance]
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: apt-get update && apt-get install -y fonts-noto-cjk build-essential
      - run: npm ci
      - name: Verify browser image and record fonts
        run: |
          node -e "if(require('playwright/package.json').version !== '1.64.1') throw Error('Update the pinned browser image alongside Playwright')"
          mkdir -p .local/verification
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          fc-list | sort | sha256sum > .local/verification/fonts.sha256
      - run: npm run verify:browser -- --${{ matrix.run }}-only
        env:
          HG_BROWSER: chromium
      - name: Publish visual evidence index
        if: always() && matrix.run == 'functional'
        run: |
          node tools/visual-report.mjs
          echo 'Visual evidence is in public-verification-functional/verification/visual-report.html. Review expected changes before accepting a baseline.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-verification-${{ matrix.run }}
          path: |
            .local/verification/**/*.json
            .local/verification/**/*.png
            .local/verification/**/*.webm
            .local/verification/**/*.html
            .local/verification/*.sha256
            .local/beta8/*.json
            .local/beta8/*.png
            .local/beta8/videos
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
      - run: npm ci
      - run: node tools/verify-timezones.mjs
      - run: npm run verify:compat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.node }}
          path: |
            .local/compat-v2/report.json
            .local/timezone-verification/report.json
  package-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run pack:theme
      - name: Install the exact package
        run: |
          PACKAGE="dist/hexo-theme-hypergraph-$(node -p 'require("./package.json").version').tgz"
          HASH="$(sha256sum "$PACKAGE" | cut -d ' ' -f1)"
          npm run verify:package -- "$PACKAGE" "$HASH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-install
          path: |
            .local/install-v21-report.json
            .local/package-inventory.json
            dist/*.tgz
  showcase:
    needs: [fast, public-verification, compatibility, package-install]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: package-install
          path: .local/verified-package
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: pages
      - name: Build public showcase from the verified package
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          PACKAGE="$(find .local/verified-package -name '*.tgz' -print -quit)"
          node tools/build-showcase.mjs "$PACKAGE" "${PAGES_BASE_URL:-https://drtxdt.github.io/Hypergraph/}"
      - run: npx playwright install --with-deps chromium
      - run: node tools/verify-showcase.mjs
        env:
          HG_BROWSER: chromium
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .local/showcase/public
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: showcase
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
