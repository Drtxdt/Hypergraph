name: Verify theme
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  TZ: UTC
jobs:
  public-verification:
    strategy:
      fail-fast: false
      matrix:
        run: [primary, independent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:browser
        env:
          HG_BROWSER: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-verification-${{ matrix.run }}
          path: .local/verification
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
      - run: npm ci
      - run: node tools/verify-timezones.mjs
      - run: npm run verify:compat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.node }}
          path: |
            .local/compat-v2/report.json
            .local/timezone-verification/report.json
  package-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run pack:theme
      - name: Install the exact package
        run: |
          PACKAGE="dist/hexo-theme-hypergraph-$(node -p 'require("./package.json").version').tgz"
          HASH="$(sha256sum "$PACKAGE" | cut -d ' ' -f1)"
          npm run verify:package -- "$PACKAGE" "$HASH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-install
          path: |
            .local/install-v21-report.json
            .local/package-inventory.json
            dist/*.tgz
